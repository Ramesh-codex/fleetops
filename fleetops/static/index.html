<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetOps Live</title>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<script src="/static/vendor/leaflet/leaflet.js"></script>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1b1f24; --muted:#6a7380; --line:#e3e6ea;
          --ok:#1f8a4c; --warn:#c77700; --bad:#c62828; --accent:#2457d6; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; color:var(--ink); background:var(--bg);
         display:grid; grid-template-columns: 1fr 360px; height:100vh; }
  #map { height:100vh; }
  aside { background:var(--panel); border-left:1px solid var(--line); overflow:auto; padding:16px; }
  h1 { font-size:16px; margin:0 0 4px; } h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em;
       color:var(--muted); margin:18px 0 8px; }
  .sub { color:var(--muted); font-size:12px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:8px; }
  .stat b { display:block; font-size:18px; font-variant-numeric: tabular-nums; }
  .row { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .row > span:last-child { color:var(--muted); font-variant-numeric: tabular-nums; text-align:right; }
  .pill { font-size:11px; padding:1px 6px; border-radius:99px; color:#fff; }
  .plan { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; font-size:13px; }
  .plan .meta { color:var(--muted); font-size:12px; margin:4px 0; }
  .plan ul { margin:4px 0 0 16px; padding:0; color:var(--muted); font-size:12px; }
  .plan .risk { color:var(--warn); }
  .plan button { font:inherit; font-size:12px; padding:4px 10px; border-radius:6px; border:1px solid var(--line);
                 background:var(--panel); cursor:pointer; margin-right:6px; margin-top:6px; }
  .plan button.go { background:var(--ok); color:#fff; border-color:var(--ok); }
  .plan details { margin-top:6px; } .plan summary { cursor:pointer; color:var(--accent); font-size:12px; }
  .actas { display:flex; gap:8px; align-items:center; margin-top:8px; font-size:12px; color:var(--muted); }
  .actas select { font:inherit; font-size:12px; }
  .ok{background:var(--ok)} .warn{background:var(--warn)} .bad{background:var(--bad)} .done{background:var(--muted)}
  @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height:auto; }
    #map { height:55vh; } aside { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<div id="map"></div>
<aside>
  <h1>FleetOps Live</h1>
  <div class="sub">Synthetic fleet · <span id="clock">–</span></div>
  <div class="stats">
    <div class="stat"><b id="s-active">–</b><span class="sub">active</span></div>
    <div class="stat"><b id="s-alerts">–</b><span class="sub">alerts</span></div>
    <div class="stat"><b id="s-lost">–</b><span class="sub">GPS lost</span></div>
    <div class="stat"><b id="s-acc">–</b><span class="sub" id="l-acc">accepted</span></div>
    <div class="stat"><b id="s-dup">–</b><span class="sub" id="l-dup">dup dropped</span></div>
    <div class="stat"><b id="s-ooo">–</b><span class="sub" id="l-ooo">late dropped</span></div>
  </div>
  <h2>Buses</h2><div id="buses"></div>
  <h2>Parent alerts</h2><div id="alerts"></div>
  <div id="recovery" hidden>
    <h2>Recovery plans</h2>
    <div class="actas">Act as <select id="role"></select></div>
    <div id="plans" style="margin-top:8px"></div>
  </div>
  <h2>Incidents</h2><div id="incidents"></div>
</aside>
<script>
const map = L.map('map').setView([37.3382, -121.8863], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 18, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
const markers = {}; let routesLayer = null; let routesRun = null;
const fmt = ts => ts ? new Date(ts * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}) : '–';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function j(u) { const r = await fetch(u); return r.json(); }

async function drawRoutes(run) {
  if (routesRun === run) return;
  routesRun = run;
  if (routesLayer) routesLayer.remove();
  routesLayer = L.layerGroup().addTo(map);
  const routes = await j('/routes'); const all = [];
  for (const r of routes) {
    L.polyline(r.path, { color: '#2457d6', weight: 3, opacity: .35 }).addTo(routesLayer);
    for (const s of r.stops) {
      all.push([s.lat, s.lon]);
      L.circleMarker([s.lat, s.lon], { radius: s.name === 'School' ? 6 : 3, color: '#2457d6', weight: 1, fillOpacity: .8 })
        .bindTooltip(`${esc(r.name)} · ${esc(s.name)}`).addTo(routesLayer);
    }
  }
  if (all.length) map.fitBounds(all, { padding: [30, 30] });
}

function status(b) {
  if (b.finished) return ['done', 'arrived'];
  if (b.breakdown) return ['bad', 'breakdown'];
  if (b.gps_lost) return ['bad', 'GPS lost'];
  if (b.speed_est_mps !== null && b.speed_est_mps < 2) return ['warn', 'slow'];
  return ['ok', 'moving'];
}

async function tick() {
  try {
    const [health, b, alerts, incs, stats] = await Promise.all(
      [j('/health'), j('/buses'), j('/notifications?limit=12'), j('/incidents'), j('/stats')]);
    await drawRoutes(health.run);
    await initRecovery(health.mode);
    document.getElementById('clock').textContent = `sim ${fmt(b.sim_now)} · ${health.mode === 'db' ? 'Kafka pipeline' : 'run ' + health.run}`;
    const c = stats.counters, v = k => (c[k] ?? '–');
    document.getElementById('s-active').textContent = b.buses.filter(x => !x.finished).length;
    document.getElementById('s-alerts').textContent = v('notifications');
    document.getElementById('s-lost').textContent = b.buses.filter(x => x.gps_lost).length;
    if (health.mode === 'db') {
      // Pipeline mode: ingestion counters live in the consumer's metrics, so show stored totals.
      document.getElementById('l-acc').textContent = 'incidents';
      document.getElementById('l-dup').textContent = 'dead letters';
      document.getElementById('l-ooo').textContent = 'mode';
      document.getElementById('s-acc').textContent = v('incidents');
      document.getElementById('s-dup').textContent = v('dead_letters');
      document.getElementById('s-ooo').textContent = 'Kafka';
    } else {
      document.getElementById('s-acc').textContent = v('accepted');
      document.getElementById('s-dup').textContent = v('duplicate');
      document.getElementById('s-ooo').textContent = v('out_of_order');
    }

    let html = '';
    for (const x of b.buses) {
      const [cls, label] = status(x);
      if (x.lat !== null) {
        const color = { ok: '#1f8a4c', warn: '#c77700', bad: '#c62828', done: '#6a7380' }[cls];
        if (!markers[x.bus_id]) markers[x.bus_id] = L.circleMarker([x.lat, x.lon], { radius: 8, weight: 2, fillOpacity: .9 }).addTo(map);
        markers[x.bus_id].setLatLng([x.lat, x.lon]).setStyle({ color, fillColor: color })
          .bindTooltip(`${x.bus_id} · ${label}`);
      }
      const eta = x.next_stop_eta_ts ? Math.max(0, Math.round((x.next_stop_eta_ts - b.sim_now) / 60)) + ' min' : '';
      html += `<div class="row"><span>${esc(x.bus_id)} <span class="pill ${cls}">${label}</span></span>
               <span>${x.next_stop ? esc(x.next_stop) + ' · ' + eta : ''}</span></div>`;
    }
    document.getElementById('buses').innerHTML = html;
    const kindLabel = { DELAY_UPDATE: ['bad', 'delayed'], APPROACHING_AFTER_DELAY: ['warn', 'back on way'],
                        REPLACEMENT_DISPATCHED: ['ok', 'replacement sent'] };
    document.getElementById('alerts').innerHTML = alerts.map(n => {
      const k = kindLabel[n.kind];
      const pill = k ? ` <span class="pill ${k[0]}">${k[1]}</span>` : '';
      return `<div class="row"><span>${esc(n.bus_id)} → ${esc(n.stop_id)}${pill}</span><span>${fmt(n.sent_ts)}</span></div>`;
    }).join('') || '<div class="sub">none yet</div>';
    document.getElementById('incidents').innerHTML = incs.slice(0, 10).map(i =>
      `<div class="row"><span>${esc(i.type)} · ${esc(i.bus_id)} <span class="pill ${i.closed_ts ? 'done' : 'bad'}">${i.closed_ts ? 'closed' : 'open'}</span></span>
       <span>${fmt(i.opened_ts)}</span></div>`).join('') || '<div class="sub">none</div>';
  } catch (e) { console.error(e); }
}
// ------------------------------------------------------------ recovery plans
let tokens = null, role = null;
try { role = localStorage.getItem('fleetops-role'); } catch (e) {}
async function initRecovery(mode) {
  if (mode !== 'db' || tokens !== null) return;
  const r = await fetch('/auth/dev-tokens');
  tokens = r.ok ? await r.json() : {};
  if (!Object.keys(tokens).length) return;
  const sel = document.getElementById('role');
  sel.innerHTML = ['viewer', 'dispatcher', 'admin'].filter(k => tokens[k])
    .map(k => `<option value="${k}">${k}</option>`).join('');
  if (!role || !tokens[role]) role = tokens.dispatcher ? 'dispatcher' : Object.keys(tokens)[0];
  sel.value = role;
  sel.onchange = () => { role = sel.value; try { localStorage.setItem('fleetops-role', role); } catch (e) {} refreshPlans(); };
  document.getElementById('recovery').hidden = false;
}
function auth() { return { Authorization: 'Bearer ' + (tokens?.[role] || '') }; }
const planPill = { pending_approval: ['warn', 'awaiting approval'], approved: ['ok', 'approved'],
  rejected: ['done', 'rejected'], no_feasible_plan: ['bad', 'no feasible plan'], superseded: ['done', 'superseded'] };
async function act(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { ...auth(), 'Content-Type': 'application/json' },
                               body: JSON.stringify(body || {}) });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    const d = e.detail || {};
    alert((d.error || d || r.statusText) + (d.failures ? '\n' + d.failures.join('\n') : ''));
  }
  refreshPlans();
}
async function refreshPlans() {
  if (!tokens || !Object.keys(tokens).length) return;
  const r = await fetch('/plans?limit=8', { headers: auth() });
  if (!r.ok) return;
  const plans = await r.json();
  const canDecide = role === 'dispatcher' || role === 'admin';
  document.getElementById('plans').innerHTML = plans.map(p => {
    const [cls, label] = planPill[p.status] || ['done', p.status];
    const checks = (p.checks || []).map(c => `<li>${c.ok ? '✓' : '✗'} ${esc(c.name)}: ${esc(c.detail)}</li>`).join('');
    const tools = (p.evidence || []).map(e => `<li>${esc(e.tool)}</li>`).join('');
    const risks = (p.risks || []).map(r => `<li class="risk">${esc(r)}</li>`).join('');
    const buttons = p.status === 'pending_approval' && canDecide
      ? `<button class="go" onclick="act('/plans/${esc(p.plan_id)}/approve')">Approve</button>
         <button onclick="act('/plans/${esc(p.plan_id)}/reject', {note: prompt('Reason for rejecting?') || ''})">Reject</button>`
      : (p.status === 'rejected' && canDecide
        ? `<button onclick="act('/incidents/${esc(p.incident_id)}/replan')">Ask for another plan</button>` : '');
    return `<div class="plan"><span class="pill ${cls}">${label}</span>
      <span class="sub"> ${esc(p.planner)} planner · attempt ${p.attempt}</span>
      <div style="margin-top:6px">${esc(p.summary)}</div>
      ${p.rationale ? `<div class="meta">Why: ${esc(p.rationale)}</div>` : ''}
      ${p.llm_error ? `<div class="meta">LLM fell back to rules: ${esc(p.llm_error)}</div>` : ''}
      ${risks ? `<ul>${risks}</ul>` : ''}
      <details><summary>Evidence and checks</summary><ul>${checks}</ul><ul>${tools}</ul></details>
      ${p.decided_by ? `<div class="meta">Decided by ${esc(p.decided_by)}${p.decision_note ? ': ' + esc(p.decision_note) : ''}</div>` : ''}
      ${buttons}</div>`;
  }).join('') || '<div class="sub">none yet — plans appear when a bus breaks down</div>';
}

tick(); setInterval(tick, 1000);
setInterval(refreshPlans, 3000);
</script>
</body>
</html>
