# Full pipeline:  producer -> Kafka -> consumer -> Postgres/PostGIS -> API + map
#                 Prometheus scrapes consumer + API; Grafana shows the dashboard.
#
#   docker compose up --build
#   map:        http://localhost:8000
#   grafana:    http://localhost:3000   (no login; dashboard "FleetOps pipeline")
#   prometheus: http://localhost:9090
#
# Demo-only mode without Kafka/Postgres:  docker compose --profile demo up demo

x-app: &app
  build: .
  restart: unless-stopped
  environment: &app-env
    FLEETOPS_KAFKA: kafka:9092
    FLEETOPS_DB: postgresql://postgres:postgres@postgres:5432/fleetops
    FLEETOPS_SEED: "42"
    FLEETOPS_BUSES: "12"

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fleetops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleetops"]
      interval: 3s
      timeout: 3s
      retries: 30

  consumer:
    <<: *app
    command: ["python", "-m", "fleetops.consumer"]
    environment:
      <<: *app-env
      FLEETOPS_HEALTH_URL: http://localhost:9108/metrics
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  producer:
    <<: *app
    command: ["python", "-m", "fleetops.producer"]
    environment:
      <<: *app-env
      FLEETOPS_SPEEDUP: "${FLEETOPS_SPEEDUP:-10}"
      FLEETOPS_POISON: "${FLEETOPS_POISON:-0.001}"
    healthcheck:
      disable: true            # a pure producer serves nothing to check
    depends_on:
      kafka: { condition: service_healthy }

  # Plans every breakdown (Claude when ANTHROPIC_API_KEY is set, rules otherwise).
  # Separate from the consumer so a slow LLM call never holds up GPS ingestion.
  recovery:
    <<: *app
    command: ["python", "-m", "fleetops.recovery.worker"]
    environment:
      <<: *app-env
      FLEETOPS_PLANNER: "${FLEETOPS_PLANNER:-auto}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      FLEETOPS_LLM_MODEL: "${FLEETOPS_LLM_MODEL:-claude-haiku-5-5}"
      FLEETOPS_HEALTH_URL: http://localhost:9109/metrics
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    environment:
      <<: *app-env
      FLEETOPS_MODE: db
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]

  demo:
    build: .
    profiles: ["demo"]
    environment:
      FLEETOPS_MODE: demo
    ports:
      - "8000:8000"

volumes:
  pgdata:
