name: ci
on: [push, pull_request]

jobs:
  # Unit tests + v0.1 tracking benchmark (no infrastructure).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python bench/run_bench.py

  # Pipeline tests and benchmark against REAL Kafka + PostGIS from docker compose.
  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Start Kafka and Postgres
        run: docker compose up -d --wait kafka postgres
      - name: Create test databases
        run: |
          docker compose exec -T postgres psql -U postgres -c "CREATE DATABASE fleetops_test"
          docker compose exec -T postgres psql -U postgres -c "CREATE DATABASE fleetops_bench"
      - name: Pipeline + real-Kafka tests
        env:
          FLEETOPS_TEST_DB: postgresql://postgres:postgres@localhost:5432/fleetops_test
          FLEETOPS_TEST_KAFKA: localhost:9094
        run: pytest -q tests/test_pipeline.py tests/test_kafka_integration.py -rs
      - name: Pipeline benchmark (real Kafka)
        run: |
          python bench/pipeline_bench.py --kafka localhost:9094 \
            --db postgresql://postgres:postgres@localhost:5432/fleetops_bench --out pipeline.md
          cat pipeline.md >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: docker compose logs kafka postgres | tail -100

  # Whole stack up: producer -> Kafka -> consumer -> Postgres -> API, Prometheus, Grafana.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    env:
      FLEETOPS_SPEEDUP: "60"
      FLEETOPS_POISON: "0.01"
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config -q
      - run: docker compose up -d --build --wait kafka postgres consumer api prometheus grafana
      - run: docker compose up -d producer
      - name: Alerts, incidents and dead letters reach the API
        run: |
          for i in $(seq 1 60); do
            s=$(curl -sf localhost:8000/stats || true)
            echo "$s"
            if echo "$s" | python3 -c "import sys,json; c=json.load(sys.stdin)['counters']; sys.exit(0 if c['notifications']>20 and c['dead_letters']>0 else 1)" 2>/dev/null; then
              echo OK; break
            fi
            sleep 3
          done
          curl -sf localhost:8000/stats | python3 -c "import sys,json; c=json.load(sys.stdin)['counters']; assert c['notifications']>20 and c['dead_letters']>0, c"
      - name: Prometheus scrapes the consumer
        run: |
          for i in $(seq 1 20); do
            curl -sf 'localhost:9090/api/v1/query?query=fleetops_consumer_messages_total' | grep -q '"result":\[{' && { echo OK; exit 0; }
            sleep 3
          done
          exit 1
      - name: Grafana has the dashboard
        run: |
          for i in $(seq 1 20); do
            curl -sf localhost:3000/api/dashboards/uid/fleetops | grep -q 'FleetOps pipeline' && { echo OK; exit 0; }
            sleep 3
          done
          exit 1
      - if: always()
        run: docker compose logs consumer producer api | tail -80
